<div
  class="bg-linear-to-b from-black via-zinc-900 to-black h-screen flex flex-col justify-between font-sans"
>
  <!-- Encabezado con el Logo -->
  <header class="px-8 py-6 md:px-16">
    <h1
      class="text-4xl text-center font-extrabold tracking-wider text-red-600 font-serif select-none"
    >
      SHOWFLIX
    </h1>
  </header>

  <!-- Contenedor de la Tarjeta de Login -->
  <main class="grow flex items-start justify-center px-4 sm:items-center">
    <div
      class="w-full max-w-112.5 bg-black/75 rounded-md p-8 md:p-16 border border-zinc-800/40 backdrop-blur-sm shadow-2xl"
    >
      <h2 class="text-3xl font-bold tracking-tight text-white mb-7">Sign In</h2>

      <!-- Tu Formulario de Angular -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Input de Email -->
        <div>
          <input
            type="email"
            formControlName="email"
            placeholder="Email"
            class="block w-full rounded bg-zinc-800/80 px-4 py-3.5 text-white border border-zinc-600 placeholder:text-zinc-400 focus:outline-none focus:border-white focus:ring-1 focus:ring-white text-sm transition-all"
          />
        </div>

        <!-- Input de Password -->
        <div>
          <input
            type="password"
            formControlName="password"
            placeholder="Password"
            class="block w-full rounded bg-zinc-800/80 px-4 py-3.5 text-white border border-zinc-600 placeholder:text-zinc-400 focus:outline-none focus:border-white focus:ring-1 focus:ring-white text-sm transition-all"
          />
        </div>

        <!-- Botón de Iniciar Sesión -->
        <div class="pt-2">
          <button
            type="submit"
            class="flex w-full justify-center rounded bg-red-600 px-3 py-3 text-sm font-semibold text-white hover:bg-red-700 transition duration-200 cursor-pointer"
          >
            Iniciar sesión
          </button>
        </div>
      </form>

      <!-- Pie de la tarjeta -->
      <div class="mt-16 text-sm text-zinc-500">
        <p>
          ¿Primera vez en Showflix?
          <a href="#" class="text-white font-medium hover:underline ml-1">Suscríbete ya</a>.
        </p>
      </div>
    </div>
  </main>

  <!-- Footer inferior -->
  <footer
    class="bg-black/80 border-t border-zinc-800/60 py-6 text-center text-xs text-zinc-500 hidden sm:block"
  >
    <p>© 2026 Showflix, Inc.</p>
  </footer>
</div>
