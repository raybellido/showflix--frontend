<div class="relative flex min-h-screen flex-col overflow-hidden">
  <div class="pointer-events-none absolute inset-0 projector-glow" aria-hidden="true"></div>
  <div class="film-strip opacity-60" aria-hidden="true"></div>

  <header class="relative px-6 py-6 sm:px-10">
    <a routerLink="/" class="inline-block font-display text-2xl tracking-tight select-none">
      <span class="text-screen">SHOW</span><span class="text-amber">FLIX</span>
    </a>
  </header>

  <main class="relative flex grow items-center justify-center px-4 py-10">
    <div class="w-full max-w-md border border-halo/50 bg-ticket/70 p-8 backdrop-blur-sm sm:p-10">
      <p class="font-mono text-xs tracking-[0.3em] text-amber">SALA DE MIEMBROS</p>
      <h1 class="mt-3 font-display text-3xl text-screen">INICIAR SESIÓN</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-5">
        @if (loginError()) {
          <p
            class="border border-red-400/40 bg-red-400/10 px-4 py-3 font-mono text-xs text-red-300"
            role="alert"
          >
            {{ loginError() }}
          </p>
        }

        <div>
          <label for="email" class="mb-2 block font-mono text-xs tracking-widest text-grain">EMAIL</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="tucorreo@cine.com"
            class="block w-full rounded-none border border-halo/60 bg-theater px-4 py-3 text-sm text-screen placeholder:text-grain/50 focus:border-amber focus:outline-none"
          />
        </div>

        <div>
          <label for="password" class="mb-2 block font-mono text-xs tracking-widest text-grain">CONTRASEÑA</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="block w-full rounded-none border border-halo/60 bg-theater px-4 py-3 text-sm text-screen placeholder:text-grain/50 focus:border-amber focus:outline-none"
          />
        </div>

        <button
          type="submit"
          class="mt-2 w-full rounded-none bg-amber px-4 py-3 font-mono text-sm font-bold tracking-widest text-theater transition-colors hover:bg-amber-soft"
        >
          ENTRAR A LA SALA
        </button>
      </form>

      <p class="mt-8 text-sm text-grain">
        ¿Primera vez en Showflix?
        <a href="#" class="font-mono text-xs tracking-widest text-amber hover:underline">SUSCRÍBETE</a>.
      </p>
    </div>
  </main>

  <footer class="relative px-6 py-6 text-center font-mono text-[10px] tracking-[0.3em] text-grain/60 sm:px-10">
    © 2026 SHOWFLIX · TU CINE EN CASA
  </footer>
</div>
