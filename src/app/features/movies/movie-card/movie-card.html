<a
  [routerLink]="['/movies', movie().id]"
  class="group block focus-visible:outline-none"
>
  <div
    class="relative overflow-hidden border border-halo/40 bg-ticket transition-all duration-300 group-hover:border-amber/70 group-hover:shadow-[0_0_0_1px_var(--color-amber),0_0_30px_-6px_rgba(232,163,61,0.45)]"
  >
    <img
      [src]="movie().imageUrl"
      [alt]="movie().title"
      class="aspect-[2/3] w-full object-cover transition-transform duration-500 group-hover:scale-105"
      loading="lazy"
    />

    <div
      class="pointer-events-none absolute inset-0 bg-gradient-to-t from-theater via-theater/25 to-transparent"
      aria-hidden="true"
    ></div>

    <div class="absolute inset-x-0 bottom-0 p-4">
      <p class="font-mono text-[10px] tracking-[0.3em] text-amber">{{ movie().genre }}</p>
      <h3 class="mt-2 font-display text-lg leading-snug text-screen">{{ movie().title }}</h3>

      <div class="mt-3 flex items-center justify-between font-mono text-xs text-grain">
        <span class="inline-flex items-center gap-1.5 text-screen">
          <svg class="h-3.5 w-3.5 text-amber" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
            />
          </svg>
          {{ movie().rating }}
        </span>
        <span>{{ movie().releaseYear }}</span>
      </div>
    </div>
  </div>
</a>
