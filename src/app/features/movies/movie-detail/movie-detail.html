@if (movie()) {
  <div class="relative min-h-screen overflow-hidden">
    <div class="absolute inset-0" aria-hidden="true">
      <img
        [src]="movie()!.imageUrl"
        [alt]="movie()!.title"
        class="h-full w-full object-cover opacity-30"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-theater via-theater/70 to-theater/40"></div>
      <div class="absolute inset-0 projector-glow"></div>
    </div>

    <div
      class="relative mx-auto flex min-h-screen max-w-7xl flex-col justify-end px-4 pb-16 pt-24 sm:px-6 lg:px-8"
    >
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-amber">{{ movie()!.genre }}</p>

      <h1 class="mt-4 max-w-3xl font-display text-5xl leading-tight text-screen sm:text-7xl">
        {{ movie()!.title }}
      </h1>

      <div class="mt-6 flex flex-wrap items-center gap-x-8 gap-y-2 font-mono text-sm text-grain">
        <span class="inline-flex items-center gap-2 text-screen">
          <svg class="h-4 w-4 text-amber" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
            />
          </svg>
          {{ movie()!.rating }}
        </span>
        <span>{{ movie()!.releaseYear }}</span>
        <span>{{ movie()!.duration }} MIN</span>
      </div>

      <p class="mt-6 max-w-2xl text-lg leading-relaxed text-screen/80">
        {{ movie()!.description }}
      </p>

      <div class="mt-10 flex flex-wrap items-center gap-4">
        <a
          [href]="movie()!.trailerUrl"
          target="_blank"
          class="inline-flex items-center gap-3 rounded-none border border-halo/60 px-8 py-4 font-mono text-sm tracking-widest text-screen transition-colors hover:border-amber hover:text-amber"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          VER TRÁILER
        </a>

        <button
          (click)="toggleFavorite()"
          class="inline-flex items-center gap-3 px-8 py-4 font-mono text-sm font-bold tracking-widest transition-colors"
          [class.bg-amber]="isFavorite()"
          [class.text-theater]="isFavorite()"
          [class.hover:bg-amber-soft]="isFavorite()"
          [class.border]="!isFavorite()"
          [class.border-amber]="!isFavorite()"
          [class.text-amber]="!isFavorite()"
          [class.hover:bg-amber]="!isFavorite()"
          [class.hover:text-theater]="!isFavorite()"
        >
          @if (isFavorite()) {
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          } @else {
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          }
          {{ isFavorite() ? 'EN FAVORITOS' : 'AÑADIR A FAVORITOS' }}
        </button>
      </div>
    </div>
  </div>
}
